name: Update RetroArch Nightly

on:
  schedule:
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if checksums have not changed'
        type: boolean
        required: false
        default: false

env:
  CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}

jobs:
  update-package:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHOCO_PAT || secrets.GITHUB_TOKEN }}

      - name: Run Nightly Update Script
        id: update
        shell: powershell
        run: |
          $force = "${{ github.event.inputs.force }}" -eq 'true'
          $params = @{}
          if ($force) { $params['Force'] = $true }

          $result = & .\retroarch-nightly\update.ps1 @params

          [xml]$nuspec = Get-Content .\retroarch-nightly\retroarch-nightly.nuspec
          $targetVer = $nuspec.package.metadata.version
          echo "TARGET_VERSION=$targetVer" >> $env:GITHUB_ENV

          $gitDiff = git status --porcelain
          if ($gitDiff -or $force) {
            echo "HAS_CHANGES=true" >> $env:GITHUB_ENV
          } else {
            echo "HAS_CHANGES=false" >> $env:GITHUB_ENV
          }

      - name: Build Chocolatey package
        if: env.HAS_CHANGES == 'true'
        shell: powershell
        run: |
          cd retroarch-nightly
          choco pack

      - name: Push Chocolatey package
        if: env.HAS_CHANGES == 'true' && env.CHOCO_API_KEY != ''
        shell: powershell
        run: |
          cd retroarch-nightly
          $nupkg = Get-ChildItem -Filter "retroarch-nightly.*.nupkg" | Select-Object -First 1
          if ($nupkg) {
            choco push $nupkg.Name --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          } else {
            Write-Error "No .nupkg file found to push"
          }

      - name: Commit and push changes
        if: env.HAS_CHANGES == 'true'
        shell: powershell
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add retroarch-nightly/*
          git diff --staged --quiet || git commit -m "retroarch-nightly: Update to $env:TARGET_VERSION"
          git push
