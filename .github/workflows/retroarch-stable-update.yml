name: Update RetroArch Stable

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'RetroArch version to update (leave empty to auto-detect latest release)'
        required: false
        default: ''
      force:
        description: 'Force re-packaging even if already current version'
        type: boolean
        required: false
        default: false

env:
  CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}

jobs:
  update-retroarch:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.CHOCO_PAT || secrets.GITHUB_TOKEN }}

      - name: Run Update Script
        id: update
        shell: powershell
        run: |
          $inputVersion = "${{ github.event.inputs.version }}".Trim()
          $force = "${{ github.event.inputs.force }}" -eq 'true'
          $params = @{}
          if ($inputVersion) { $params['Version'] = $inputVersion }
          if ($force) { $params['Force'] = $true }

          & .\retroarch\update.ps1 @params

          [xml]$nuspec = Get-Content .\retroarch\retroarch.nuspec
          $targetVer = $nuspec.package.metadata.version
          echo "TARGET_VERSION=$targetVer" >> $env:GITHUB_ENV

          $gitDiff = git status --porcelain
          if ($gitDiff -or $force) {
            echo "HAS_CHANGES=true" >> $env:GITHUB_ENV
          } else {
            echo "HAS_CHANGES=false" >> $env:GITHUB_ENV
          }

      - name: Pack Chocolatey package
        if: env.HAS_CHANGES == 'true'
        shell: powershell
        run: |
          cd retroarch
          choco pack

      - name: Push Chocolatey package
        if: env.HAS_CHANGES == 'true' && env.CHOCO_API_KEY != ''
        shell: powershell
        run: |
          cd retroarch
          $nupkg = Get-ChildItem -Filter "retroarch.*.nupkg" | Select-Object -First 1
          if ($nupkg) {
            choco push $nupkg.Name --source https://push.chocolatey.org/ --api-key $env:CHOCO_API_KEY
          } else {
            Write-Error "No .nupkg file found to push"
          }

      - name: Commit and push changes
        if: env.HAS_CHANGES == 'true'
        shell: powershell
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add retroarch/*
          git diff --staged --quiet || git commit -m "retroarch: Update to version $env:TARGET_VERSION"
          git push
